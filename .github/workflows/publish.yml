name: publish

# Publish to npm when a version tag is pushed, e.g.:
#   npm version 0.3.0 && git push --follow-tags
#
# Authentication uses npm OIDC trusted publishing — no NPM_TOKEN secret. This
# requires a one-time setup on npmjs.com: on the package page, add this repo and
# the `publish.yml` workflow as a Trusted Publisher. (The package must already
# exist, so the very first publish has to be done manually with `npm publish`.)
on:
  push:
    tags:
      - "v*"
  # Manual trigger: publishes whatever version is in package.json on the chosen
  # ref. Useful to re-run a failed publish without re-tagging.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the `environment` in the npm trusted-publisher config exactly —
    # it becomes an OIDC claim, and a mismatch fails the token exchange (404).
    environment: NPM Publishing
    steps:
      - uses: actions/checkout@v6
      # NOTE: deliberately no `registry-url` here. Setting it makes setup-node
      # write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`; with no token that
      # empty value makes npm auth with an empty token (HTTP 404) instead of
      # falling through to OIDC. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Provenance is generated automatically under trusted publishing.
      - run: npm publish
